<!doctype html>
<meta charset="utf-8">
<title>Generals Launcher</title>
<style>
  body { font: 15px system-ui; margin: 24px; max-width: 520px }
  label { display: block; margin: 12px 0 4px }
  button { margin-top: 20px; padding: 8px 20px }
  fieldset { margin-top: 16px }
</style>
<h2>Generals Launcher</h2>
<label>Game install <select id="game"></select></label>
<label>or game folder <input id="dir" size="40" placeholder="folder containing INIZH.big"></label>
<label>Mod <select id="mod"><option value="">None (vanilla)</option></select></label>
<label>Resolution <input id="w" type="number" size="5"> x <input id="h" type="number" size="5"></label>
<label><input id="fs" type="checkbox"> Fullscreen</label>
<fieldset>
  <legend>Online (relay server)</legend>
  <label>Server <input id="srv" placeholder="host:7777"></label>
  <label>Serial <input id="ser" type="password" autocomplete="off"></label>
  <small>Leave blank: the server issues one on first connect.</small>
  <button id="save">Save</button> <button id="net">Connect</button>
  <p id="relay">Offline</p>
</fieldset>
<button id="go">Play</button> <button id="sk">Quick Skirmish (vs AI)</button>
<p id="msg"></p>
<script>
  const { invoke } = window.__TAURI__.core, $ = (i) => document.getElementById(i);
  const dpr = devicePixelRatio;
  $("w").value = Math.round(screen.width * dpr); $("h").value = Math.round(screen.height * dpr);
  invoke("detect_games").then((g) => {
    $("game").innerHTML = g.map((x) => `<option value="${x.dir}">${x.zero_hour ? "Zero Hour" : "Generals"} - ${x.dir}</option>`).join("")
      || "<option value=''>No Steam install found</option>";
  });
  invoke("installed_mods").then((m) => m.forEach((x) => $("mod").add(new Option(x.name, x.id))));
  invoke("get_config").then((c) => { $("dir").value = c.game_dir; $("srv").value = c.server; $("ser").placeholder = c.serial_masked || "issued on first connect"; });
  $("save").onclick = () => invoke("save_config", { server: $("srv").value, serial: $("ser").value })
    .then(() => { $("ser").value = ""; return invoke("get_config"); })
    .then((c) => $("ser").placeholder = c.serial_masked || "issued on first connect", (e) => $("relay").textContent = e);
  $("net").onclick = () => invoke($("net").textContent === "Connect" ? "relay_connect" : "relay_disconnect")
    .catch((e) => $("relay").textContent = e);
  setInterval(() => invoke("relay_status").then((s) => {
    $("relay").textContent = s;
    $("net").textContent = s === "Offline" || s.startsWith("Server") || s.startsWith("This") || s.startsWith("Too") || s === "Rejected by server" ? "Connect" : "Disconnect";
  }), 1000);
  const play = (skirmish) => invoke("launch_game", {
    gameDir: $("dir").value.trim() || $("game").value, modId: $("mod").value || null,
    width: +$("w").value, height: +$("h").value, fullscreen: $("fs").checked, skirmish,
  }).then(() => $("msg").textContent = "Launched.", (e) => $("msg").textContent = e);
  $("go").onclick = () => play(false);
  $("sk").onclick = () => play(true);
</script>
