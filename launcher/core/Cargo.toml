[package]
name = "generals-core"
version = "0.5.3"
edition = "2021"
license = "MIT"

[dependencies]
generals-proto = { path = "../../shared" }
bzip2 = "0.6"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Release signatures: the updater checks SHA256SUMS against a built-in public key (see update.rs). Verification only needs
# this crate; the signing example uses the same one.
ed25519-dalek = "3"

[dev-dependencies]
generals-server = { path = "../../server" }
