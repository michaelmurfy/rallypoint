# docker compose up -d
# Clients get a serial automatically on first connect. For an invite-only server set
# GENERALS_REGISTRATION=closed below and hand out serials yourself:
# docker compose exec relay generals-server issue alice
# docker compose exec relay generals-server revoke XXXX-XXXX-XXXX-XXXX
services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # environment:
    #   GENERALS_REGISTRATION: closed
    ports:
      - "7777:7777/udp"
    volumes:
      - relay-data:/data

volumes:
  relay-data:
