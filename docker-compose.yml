# Use the Makefile (make up / down / update) rather than calling this directly.
services:
  relay:
    # The image CI builds for each release. `make dev` builds from this checkout instead (docker-compose.build.yml).
    image: ghcr.io/michaelmurfy/rallypoint-relay:${RELAY_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      GEO_DIR: /geo
    ports:
      - "${PORT:-7777}:7777/udp"
    volumes:
      - relay-data:/data
      - ./data/geo:/geo:ro
    # The server needs nothing but its UDP socket and the /data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # A runaway or attacked relay must not take the host with it.
    mem_limit: 256m
    pids_limit: 64
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
