# Use the Makefile (make up / down / update) rather than calling this directly.
services:
  relay:
    # The image CI builds for each release. `make build` builds from this checkout instead (docker-compose.build.yml).
    image: ghcr.io/michaelmurfy/rallypoint-relay:${RELAY_TAG:-latest}
    restart: unless-stopped
    # Only containers with this label are updated by Watchtower (the playbook runs it that way).
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file: .env
    environment:
      GEO_DIR: /geo
      GENERALS_BIND: 0.0.0.0:${PORT:-7777}
    # The host's network (Linux): a published UDP port goes through Docker's NAT and a userland proxy, which adds a hop
    # and delay to every game packet and hides the players' real addresses from the country limit. Open the UDP port in
    # the host's firewall.
    network_mode: host
    volumes:
      - relay-data:/data
      - ./data/geo:/geo:ro
    # `docker compose up --wait` (make up) waits for this. The server touches a file once a second; `health` checks it is fresh.
    healthcheck:
      test: ["CMD", "rallypoint-server", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The server needs nothing but its UDP socket and the /data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    # A runaway or attacked relay must not take the host with it.
    mem_limit: 256m
    pids_limit: 64
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

volumes:
  relay-data:
