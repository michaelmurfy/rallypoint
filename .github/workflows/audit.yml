name: Dependency audit

# Known vulnerabilities in the Rust dependencies (RustSec advisory database): on changes to the lock file, and weekly,
# because an advisory can appear for a version that has not changed.
on:
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml"]
  push:
    branches: [main]
    paths: ["Cargo.lock", "**/Cargo.toml"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - run: cargo audit
