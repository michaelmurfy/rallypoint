# Builds the engine, launcher bundles, relay server and Docker image.
#   push a tag vX.Y.Z or vX.Y.Z-alpha.N  -> build everything and publish a GitHub Release
#   manual run (Actions > Release > Run)   -> build everything, publish nothing (artifacts only)
# Plain pushes and PRs never run this; see ci.yml for the fast checks.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- game engine (our patches applied on top of the submodule) -----------------------------
  engine-macos:
    name: Engine (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: brew install ninja
      - run: sh patches/apply.sh
      - name: Configure and build
        working-directory: engine
        run: |
          cmake --preset apple-arm64-release
          cmake --build build/apple-arm64-release --config Release --target z_generals
      - name: Package (relocatable, ad-hoc signed)
        working-directory: engine
        run: bash scripts/package-macos-release.sh Release build/apple-arm64-release
      - name: Flatten payload
        run: |
          mkdir -p out/engine
          cp -RL engine/dist/GeneralsZH-macOS-arm64/. out/engine/
          # Textures of the Enhanced renderer (generated scorch atlas and height map, no game data), read through GEN_ASSETS.
          cp -R patches/upstream/moderngeneralszh/assets out/engine/assets
          ls -la out/engine
          strings -a out/engine/generalszh | grep -q 'DebugFrame_' || { echo "sync log writer missing from the engine"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-macos
          path: out/engine
          if-no-files-found: error

  engine-windows:
    name: Engine (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: sh patches/apply.sh
        shell: bash
      # The 32-bit Visual Studio build environment, set up directly: the third-party action that did this still runs on
      # Node.js 20, which GitHub is retiring, and it is no longer updated.
      - name: Visual Studio x86 environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ tools was not found" }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          # Run vcvarsall for x86, then hand every variable it set (PATH, INCLUDE, LIB, VCToolsRedistDir, ...) to the later steps.
          cmd /c "`"$bat`" x86 > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }
      - name: Configure and build
        working-directory: engine
        run: |
          cmake --preset win32 -DRTS_BUILD_ZEROHOUR=ON -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_CORE_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_CORE_EXTRAS=OFF -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF -DRTS_DEBUG_LOGGING=ON -DRTS_DEBUG_CRASHING=OFF -DRTS_DEBUG_STACKTRACE=OFF -DRTS_DEBUG_PROFILE=OFF
          cmake --build --preset win32
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/engine | Out-Null
          Get-ChildItem engine/build/win32/Core/Release, engine/build/win32/GeneralsMD/Release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination out/engine -Verbose
          # The engine must run on the VC++ runtime it was built with: an older system msvcp140.dll (14.29 is common)
          # crashes in std::mutex::lock. Microsoft allows these files to be shipped beside the executable.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x86" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not (Get-ChildItem out/engine -Filter *.exe | Select-String -Pattern 'DebugFrame_' -Quiet)) { throw "sync log writer missing from the engine" }
          if (-not $crt) { throw "no x86 CRT under $env:VCToolsRedistDir" }
          'msvcp140.dll', 'msvcp140_atomic_wait.dll', 'vcruntime140.dll' | ForEach-Object { Copy-Item (Join-Path $crt.FullName $_) out/engine -Verbose }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-windows
          path: out/engine
          if-no-files-found: error
      # Symbols for reading a crash dump (EIP to function). Kept as a workflow artifact only, never shipped to players.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-windows-symbols
          path: |
            engine/build/win32/GeneralsMD/Release/*.pdb
            engine/build/win32/GeneralsMD/Release/*.map
          if-no-files-found: ignore
          retention-days: 90

  # The 64-bit Windows engine (patches/0079). Direct3D 8 has no 64-bit Windows driver, so the engine ships DXVK's d3d8.dll
  # (Direct3D 8 on Vulkan); audio is the miniaudio based MiniMiles, movies are FFmpeg from vcpkg. Kept next to the
  # x86 job until it is proven in real games; the launcher prefers this one.
  engine-windows-x64:
    name: Engine (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      DXVK_VERSION: '3.1.1'
      DXVK_SHA256: '40565b4a724aadc4433fa4e010b4b23916d9b1f1baeee64e17186db94f54e608' # dxvk-3.1.1.tar.gz from github.com/doitsujin/dxvk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - run: sh patches/apply.sh
        shell: bash
      - name: Visual Studio x64 environment
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ tools was not found" }
          $bat = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          cmd /c "`"$bat`" x64 > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])" -Encoding utf8 }
          }
          # vcpkg is preinstalled on the runner; the preset reads VCPKG_ROOT. Its binary cache keeps FFmpeg from being rebuilt every run.
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP\vcpkg-cache" -Encoding utf8
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\vcpkg-cache" | Out-Null
      # The simulation maths (DetMath) must give the same bits as on macOS: the golden hashes in the test are the ones
      # every other platform checks. Compiled the way the engine is (MSVC, /fp:precise), cheap, so it runs first.
      - name: Maths test (MSVC x64)
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /fp:precise /Iengine/Core/GameEngine/Include /Iengine/Core/Libraries/Source/WWVegas/WWLib tests/detmath_test.cpp /Fe:detmath_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "detmath_test did not compile" }
          ./detmath_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "the simulation maths differs on x64" }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-x64-${{ hashFiles('engine/vcpkg.json', 'engine/vcpkg-lock.json') }}
      - name: Configure and build
        working-directory: engine
        shell: pwsh
        run: |
          # RTS.RC includes MFC's afxres.h; a forwarding header keeps the build independent of the MFC component.
          New-Item -ItemType Directory -Force -Path build/shim | Out-Null
          Set-Content build/shim/afxres.h "#include <winres.h>`n"
          cmake --preset win64-vcpkg -DRTS_BUILD_ZEROHOUR=ON -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_CORE_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_CORE_EXTRAS=OFF -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF -DRTS_DEBUG_LOGGING=ON -DRTS_DEBUG_CRASHING=OFF -DRTS_DEBUG_STACKTRACE=OFF -DRTS_DEBUG_PROFILE=OFF -DRTS_BUILD_OPTION_FFMPEG=ON "-DCMAKE_RC_FLAGS=-DWIN32 /I$PWD/build/shim"
          cmake --build --preset win64-vcpkg
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/engine | Out-Null
          Get-ChildItem engine/build/win64-vcpkg/Core/Release, engine/build/win64-vcpkg/GeneralsMD/Release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination out/engine -Verbose
          if (-not (Get-ChildItem out/engine -Filter *.exe | Select-String -Pattern 'DebugFrame_' -Quiet)) { throw "sync log writer missing from the engine" }
          # The engine must run on the VC++ runtime it was built with (see the x86 job). The 64-bit runtime also has vcruntime140_1.dll.
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw "no x64 CRT under $env:VCToolsRedistDir" }
          'msvcp140.dll', 'msvcp140_atomic_wait.dll', 'vcruntime140.dll', 'vcruntime140_1.dll' | ForEach-Object { Copy-Item (Join-Path $crt.FullName $_) out/engine -Verbose }
          # DXVK's Direct3D 8 (the d3d8.dll that 64-bit Windows does not have), pinned by version and checked against its hash.
          $url = "https://github.com/doitsujin/dxvk/releases/download/v$env:DXVK_VERSION/dxvk-$env:DXVK_VERSION.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile dxvk.tar.gz
          if ((Get-FileHash dxvk.tar.gz -Algorithm SHA256).Hash.ToLower() -ne $env:DXVK_SHA256) { throw "dxvk archive hash mismatch" }
          New-Item -ItemType Directory -Force -Path dxvk | Out-Null
          tar -xzf dxvk.tar.gz -C dxvk
          Copy-Item "dxvk/dxvk-$env:DXVK_VERSION/x64/d3d8.dll" out/engine -Verbose
          Copy-Item "dxvk/dxvk-$env:DXVK_VERSION/x64/d3d9.dll" out/engine -Verbose
          # Textures the Enhanced renderer uses (generated scorch atlas and height map, no game data), read through GEN_ASSETS.
          Copy-Item -Recurse patches/upstream/moderngeneralszh/assets out/engine/assets -Verbose
          Get-ChildItem out/engine | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-windows-x64
          path: out/engine
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-windows-x64-symbols
          path: |
            engine/build/win64-vcpkg/GeneralsMD/Release/*.pdb
            engine/build/win64-vcpkg/GeneralsMD/Release/*.map
          if-no-files-found: ignore
          retention-days: 90

  # ---- launcher app (engine bundled in as a resource) ----------------------------------------
  launcher:
    name: Launcher (${{ matrix.os }})
    needs: [engine-macos, engine-windows, engine-windows-x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, engine: engine-macos, engine64: '', bundles: "" }
          - { os: windows-latest, engine: engine-windows, engine64: engine-windows-x64, bundles: "--bundles nsis" } # MSI rejects 'alpha' style versions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"; core="${tag%%-*}"
          app=$(python3 -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['version'])")
          [ "$core" = "$app" ] || { echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1; }
      - if: matrix.engine != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.engine }}
          path: launcher/src-tauri/engine
      # The 64-bit engine goes in a subfolder; the launcher prefers it (engine::find) and falls back to the 32-bit one.
      - if: matrix.engine64 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.engine64 }}
          path: launcher/src-tauri/engine/x64
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Pinned so the cache key means something; on a miss binstall fetches a prebuilt binary.
      - id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.12.4-${{ runner.os }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-binstall
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm --locked tauri-cli@2.12.4
      - name: Work out the version
        shell: bash
        run: |
          # A tag build uses the tag (v0.1.0-beta.1 -> 0.1.0-beta.1); a manual run gets a clearly fake one.
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "RALLYPOINT_VERSION=$VERSION" >> "$GITHUB_ENV"
          # tauri.conf.json carries the base 0.1.0; this file overrides it so installers and the app are named by the real version
          printf '{"version":"%s"}' "$VERSION" > launcher/src-tauri/tauri.version.json
          echo "building $VERSION"
      # RALLYPOINT_VERSION (set above) is also compiled into the app, so the updater can tell 0.1.0-beta.1 from 0.1.0-beta.2
      - run: cargo tauri build ${{ matrix.bundles }} --config tauri.version.json
        working-directory: launcher/src-tauri
      # A glob such as "engine/*" skips subfolders, which left the 64-bit engine and the effect assets out of every
      # installer. tauri-build copies the same resource list next to the built app, so look there.
      - name: The whole engine folder is bundled
        shell: bash
        run: |
          res=target/release/engine
          ls -R "$res" | head -60
          if [ "${{ matrix.engine64 }}" != "" ]; then
            [ -f "$res/x64/generalszh.exe" ] || { echo "::error::the 64-bit engine (engine/x64) is not among the bundled resources"; exit 1; }
            [ -f "$res/generalszh.exe" ] || { echo "::error::the 32-bit engine is not among the bundled resources"; exit 1; }
            res="$res/x64"
          fi
          [ -f "$res/assets/Art/Textures/exscorch01.dds" ] || { echo "::error::the Enhanced renderer's assets folder is not among the bundled resources"; exit 1; }
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \) -exec cp -v {} dist/ \;
          ls dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-launcher-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # ---- relay server (binary + Docker image) --------------------------------------------------
  server:
    name: Relay server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "RALLYPOINT_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Binaries for Linux (x86_64, arm64, armv7), built on Debian so they run on Raspberry Pi OS too
        run: |
          docker buildx create --name multi --driver docker-container --use
          docker buildx build --builder multi -f server/Dockerfile --target binary --build-arg RALLYPOINT_VERSION="$RALLYPOINT_VERSION" \
            --platform linux/amd64,linux/arm64,linux/arm/v7 --output type=local,dest=out-bin .
          mkdir -p dist
          for p in "linux_amd64 x86_64" "linux_arm64 aarch64" "linux_arm_v7 armv7"; do
            set -- $p
            tar -C "out-bin/$1" -czf "dist/rallypoint-server-${RALLYPOINT_VERSION}-linux-$2.tar.gz" rallypoint-server
          done
          ls -l dist
      - name: Docker image and smoke test
        run: |
          docker build -f server/Dockerfile --build-arg RALLYPOINT_VERSION="$RALLYPOINT_VERSION" -t rallypoint-relay .
          # same hardening as docker-compose.yml
          docker run -d --name relay -p 7777:7777/udp --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v relay-data:/data rallypoint-relay
          sleep 1
          # a full encrypted join and sign-up with the real client code
          cargo run --release -q -p generals-core --example agent_cli -- 127.0.0.1:7777 smoke pw once
          docker exec relay rallypoint-server list | grep -q auto
      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rallypoint-relay"
          VERSION="${GITHUB_REF_NAME#v}"
          # One multi-architecture image: Docker pulls the right one for the machine (PC, Raspberry Pi, ARM server).
          # `latest` follows the newest release, prereleases included: every release so far is one, and docker-compose.yml pulls it.
          docker buildx build --builder multi -f server/Dockerfile --build-arg RALLYPOINT_VERSION="$RALLYPOINT_VERSION" \
            --platform linux/amd64,linux/arm64,linux/arm/v7 -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-server
          path: dist/*

  # ---- relay server for macOS and Windows (Linux is built above) -----------------------------
  server-desktop:
    name: Relay server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          export RALLYPOINT_VERSION="$VERSION"
          cargo build --release -p generals-server
          mkdir -p dist
          if [ "${{ matrix.os }}" = windows-latest ]; then
            (cd target/release && 7z a -tzip "$GITHUB_WORKSPACE/dist/rallypoint-server-${VERSION}-${{ matrix.name }}.zip" rallypoint-server.exe)
          else
            tar -C target/release -czf "dist/rallypoint-server-${VERSION}-${{ matrix.name }}.tar.gz" rallypoint-server
          fi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-server-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # ---- publish -------------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [launcher, server, server-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          # Sign the checksums: the app only installs an update whose SHA256SUMS.sig checks against the key built into it.
          # Without the secret the release is still published, but the in-app updater will refuse it.
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            cargo run --release -q -p generals-core --example release_sign -- sign dist/SHA256SUMS
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set: this release is unsigned and cannot be installed by the in-app updater"
          fi
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          # The release page (and the in-app "What's new") shows this release and the two before it, not the whole history.
          awk '/^## Rallypoint /{n++} n<=3' docs/release-notes.md > release-notes-short.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Rallypoint ${GITHUB_REF_NAME#v}" --notes-file release-notes-short.md --generate-notes
