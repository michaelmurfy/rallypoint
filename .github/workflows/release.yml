# Builds the engine, launcher bundles, relay server and Docker image.
#   push a tag vX.Y.Z or vX.Y.Z-alpha.N  -> build everything and publish a GitHub Release
#   manual run (Actions > Release > Run)   -> build everything, publish nothing (artifacts only)
# Plain pushes and PRs never run this; see ci.yml for the fast checks.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege: jobs that need more ask for it themselves.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- game engine (our patches applied on top of the submodule) -----------------------------
  engine-macos:
    name: Engine (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - run: brew install ninja
      - run: sh patches/apply.sh
      - name: Configure and build
        working-directory: engine
        run: |
          cmake --preset apple-arm64-release
          cmake --build build/apple-arm64-release --config Release --target z_generals
      - name: Package (relocatable, ad-hoc signed)
        working-directory: engine
        run: bash scripts/package-macos-release.sh Release build/apple-arm64-release
      - name: Flatten payload
        run: |
          mkdir -p out/engine
          cp -RL engine/dist/GeneralsZH-macOS-arm64/. out/engine/
          ls -la out/engine
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-macos
          path: out/engine
          if-no-files-found: error

  engine-windows:
    name: Engine (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
      - run: sh patches/apply.sh
        shell: bash
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Configure and build
        working-directory: engine
        run: |
          cmake --preset win32 -DRTS_BUILD_ZEROHOUR=ON -DRTS_BUILD_GENERALS=OFF -DRTS_BUILD_CORE_TOOLS=OFF -DRTS_BUILD_ZEROHOUR_TOOLS=OFF -DRTS_BUILD_CORE_EXTRAS=OFF -DRTS_BUILD_ZEROHOUR_EXTRAS=OFF
          cmake --build --preset win32
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/engine | Out-Null
          Get-ChildItem engine/build/win32/Core/Release, engine/build/win32/GeneralsMD/Release -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination out/engine -Verbose
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: engine-windows
          path: out/engine
          if-no-files-found: error

  # ---- launcher app (engine bundled in as a resource) ----------------------------------------
  launcher:
    name: Launcher (${{ matrix.os }})
    needs: [engine-macos, engine-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, engine: engine-macos, bundles: "" }
          - { os: windows-latest, engine: engine-windows, bundles: "--bundles nsis" } # MSI rejects 'alpha' style versions
          - { os: ubuntu-latest, engine: "", bundles: "" } # no Linux engine yet: launcher only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"; core="${tag%%-*}"
          app=$(python3 -c "import json;print(json.load(open('launcher/src-tauri/tauri.conf.json'))['version'])")
          [ "$core" = "$app" ] || { echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $app"; exit 1; }
      - if: matrix.engine != ''
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ matrix.engine }}
          path: launcher/src-tauri/engine
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
      # Pinned so the cache key means something; on a miss binstall fetches a prebuilt binary.
      - id: tauri-cli
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-tauri*
          key: tauri-cli-2.12.4-${{ runner.os }}
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm --locked tauri-cli@2.12.4
      - run: cargo tauri build ${{ matrix.bundles }}
        working-directory: launcher/src-tauri
        env:
          # lets the in-app updater tell 0.1.0-alpha.3 from 0.1.0-alpha.4
          RALLYPOINT_VERSION: ${{ github.ref_name }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          find target/release/bundle -type f \( -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*-setup.exe' \) -exec cp -v {} dist/ \;
          ls dist
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-launcher-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  # ---- relay server (binary + Docker image) --------------------------------------------------
  server:
    name: Relay server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: Swatinem/rust-cache@v2
      - name: Binary
        run: |
          cargo build --release -p generals-server
          mkdir -p dist
          tar -C target/release -czf dist/rallypoint-server-linux-x86_64.tar.gz rallypoint-server
      - name: Docker image and smoke test
        run: |
          docker build -f server/Dockerfile -t rallypoint-relay .
          # same hardening as docker-compose.yml
          docker run -d --name relay -p 7777:7777/udp --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v relay-data:/data rallypoint-relay
          sleep 1
          python3 scripts/smoke_relay.py 127.0.0.1 7777
          docker exec relay rallypoint-server list | grep -q auto
      - name: Push image to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rallypoint-relay"
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag rallypoint-relay "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          case "$VERSION" in *-*) ;; *) docker tag rallypoint-relay "$IMAGE:latest"; docker push "$IMAGE:latest" ;; esac
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: dist-server
          path: dist/*

  # ---- publish -------------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [launcher, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Rallypoint ${GITHUB_REF_NAME#v}" --notes-file docs/release-notes.md --generate-notes
