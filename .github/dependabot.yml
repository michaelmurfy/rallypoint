# Keeps the pinned GitHub Actions (and the Rust crates) current: a pull request when a new version comes out.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
